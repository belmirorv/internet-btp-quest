plugins {
    id 'com.android.application'
}

android {
    namespace 'br.edu.es.belmiro.internetbtp'
    compileSdk 35

    defaultConfig {
        applicationId 'br.edu.es.belmiro.internetbtp'
        minSdk 29
        targetSdk 32
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
